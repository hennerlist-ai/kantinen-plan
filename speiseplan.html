<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speiseplan Kantine im JKI</title>
    <style>
        :root { --primary: #2c3e50; --accent: #27ae60; --bg: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); padding: 5px; margin: 0; color: #333; }
        
        /* Grid für zwei Gerichte nebeneinander auf Desktop, untereinander auf Handy */
        .tages-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-bottom: 5px; }
        
        .card { background: white; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); padding: 20px; border-top: 5px solid var(--primary); display: flex; flex-direction: column; justify-content: space-between;}
        h2 { margin: 0 0 8px 0; font-size: 1.15rem; color: var(--primary); line-height: 1.3; }
        .beschreibung { font-size: 0.95rem; color: #555; margin-bottom: 12px; line-height: 1.4; flex-grow: 1; }
        .allergene { font-size: 0.75rem; color: #95a5a6; margin-bottom: 15px; font-style: italic; }
        
        .footer { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 10px; border-top: 1px solid #eee; padding-top: 15px;}
        .preis { font-weight: 700; font-size: 1.2rem; color: var(--primary); }
        
        .badges { display: flex; flex-wrap: wrap; gap: 5px; }
        .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; }
        .badge.veg { background: #f1c40f; color: #333; }
        .badge.vegan { background: var(--accent); color: white; }
        .badge.fleisch { background: #e74c3c; color: white; }
        .badge.fisch { background: #3498db; color: white; }
        .badge.option { background: white; color: var(--accent); border: 1px solid var(--accent); }
        
        /* Akkordeon */
        details { background: white; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
        summary { font-weight: 600; font-size: 1.1rem; padding: 15px 20px; cursor: pointer; list-style: none; outline: none; background: #fdfdfd; border-left: 5px solid #bdc3c7; transition: 0.2s; }
        summary:hover { background: #f4f6f7; border-left-color: var(--primary); }
        summary::-webkit-details-marker { display: none; }
        details[open] summary { border-left-color: var(--primary); border-bottom: 1px solid #eee; }
        .details-content { padding: 20px; background: #f8f9fa; border-radius: 0 0 10px 10px;}
        
        .weekend { text-align: center; padding: 30px 20px; font-weight: bold; color: #7f8c8d; background: white; border-radius: 12px; border: 2px dashed #bdc3c7; }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        const wochenDaten = [
            {
                tagId: 1, 
                wochentag: "Montag",
                gerichte: [
                    { titel: "Thüringer Rostbratwurst", beschreibung: "mit Apfel-Sauerkraut, Kartoffel-Stampf und Soße", preis: "8,20 €", deklaration: "Schwein", allergene: "2, A, G, I, J, L", veganOption: false },
                    { titel: "Auberginengyros", beschreibung: "mit Zaziki, Feta, Fladenbrot und Krautsalat", preis: "7,00 €", deklaration: "Vegetarisch", allergene: "A, G", veganOption: false }
                ]
            },
            {
                tagId: 2, 
                wochentag: "Dienstag",
                gerichte: [
                    { titel: "Crispy Chicken", beschreibung: "mit gegrillten Drillingen, Zucchini-Zwiebel-Gemüse und Knoblauch-Parmesan-Dip", preis: "8,50 €", deklaration: "Geflügel", allergene: "3, A, C, D, G, I, J, L", veganOption: false },
                    { titel: "Berliner Senfeier", beschreibung: "mit Petersilienkartoffeln", preis: "7,80 €", deklaration: "Vegetarisch", allergene: "A, C, G, I, J", veganOption: false }
                ]
            },
            {
                tagId: 3, 
                wochentag: "Mittwoch",
                gerichte: [
                    { titel: "Spaghetti Bolognese", beschreibung: "mit Parmesan und Rucolatopping", preis: "8,70 €", deklaration: "Rind, Schwein", allergene: "1, 2, A, C, I, J", veganOption: false },
                    { titel: "Linsenbratlinge", beschreibung: "mit Möhren-Lauch-Gemüse und Kartoffelpüree", preis: "6,50 €", deklaration: "Vegetarisch", allergene: "A, C, G, I", veganOption: true }
                ]
            },
            {
                tagId: 4, 
                wochentag: "Donnerstag",
                gerichte: [
                    { titel: "Hühnerfrikassee", beschreibung: "mit Leipziger Allerlei und Kartoffeln", preis: "8,50 €", deklaration: "Geflügel", allergene: "3, A, G, J, L", veganOption: false },
                    { titel: "Allgäuer Schupfnudelpfanne", beschreibung: "mit Champignons, Waldpilzen, Lauch, Zucchini und Karotten", preis: "7,00 €", deklaration: "Vegetarisch", allergene: "A, C, G, H, I, J, L", veganOption: true }
                ]
            },
            {
                tagId: 5, 
                wochentag: "Freitag",
                gerichte: [
                    { titel: "Schnitzel Wiener Art", beschreibung: "mit Kartoffelsalat, Preiselbeeren und Knusperkapern", preis: "8,70 €", deklaration: "Schwein", allergene: "2, A, C, G, J, L", veganOption: false },
                    { titel: "Penne all'Arrabiata", beschreibung: "mit Parmesan und Rucolatopping", preis: "6,80 €", deklaration: "Vegetarisch", allergene: "A, C, I, J", veganOption: true }
                ]
            }
        ];

        const urlParams = new URLSearchParams(window.location.search);
        const ansicht = urlParams.get('ansicht');
        let today = new Date().getDay();
        const app = document.getElementById('app');

        function getBadgeHtml(deklaration, veganOption) {
            let html = '';
            let bClass = 'fleisch'; // Default
            let d = deklaration.toLowerCase();
            
            if(d.includes('veg') && !d.includes('vegan')) bClass = 'veg';
            else if(d.includes('vegan')) bClass = 'vegan';
            else if(d.includes('fisch')) bClass = 'fisch';
            
            html += `<span class="badge ${bClass}">${deklaration}</span>`;
            if(veganOption) {
                html += `<span class="badge option">Auch vegan erhältlich</span>`;
            }
            return html;
        }

        function renderTagesContainer(tag) {
            let kacheln = tag.gerichte.map(gericht => `
                <div class="card">
                    <div>
                        <h2>${gericht.titel}</h2>
                        <div class="beschreibung">${gericht.beschreibung}</div>
                        ${gericht.allergene ? `<div class="allergene">Allergene & Zusatzstoffe: ${gericht.allergene}</div>` : ''}
                    </div>
                    <div class="footer">
                        <div class="badges">${getBadgeHtml(gericht.deklaration, gericht.veganOption)}</div>
                        <div class="preis">${gericht.preis}</div>
                    </div>
                </div>
            `).join('');
            
            return `<div class="tages-container">${kacheln}</div>`;
        }

        if(ansicht === 'heute') {
            const heutigesGericht = wochenDaten.find(d => d.tagId === today);
            if(heutigesGericht) {
                app.innerHTML = renderTagesContainer(heutigesGericht);
            } else {
                app.innerHTML = `<div class="weekend">Heute ist kein Kantinenbetrieb.<br>Wir wünschen ein schönes Wochenende!</div>`;
            }
        } else {
            let html = '';
            wochenDaten.forEach(tag => {
                let isOpen = tag.tagId === today ? 'open' : '';
                html += `
                    <details ${isOpen}>
                        <summary>${tag.wochentag}</summary>
                        <div class="details-content">
                            ${renderTagesContainer(tag)}
                        </div>
                    </details>
                `;
            });
            app.innerHTML = html || '<div class="weekend">Noch kein Speiseplan für diese Woche verfügbar.</div>';
        }
    </script>
</body>
</html>
